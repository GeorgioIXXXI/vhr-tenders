<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Тендеры ВХР</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e4e7ec;--accent:#1f5fbf;--go:#137a3a;--go-bg:#e7f6ec;--warn:#9a5b00;--warn-bg:#fff4e0;--bad:#b42318;--bad-bg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--muted:#98a2b3;--line:#2c3340;--accent:#6ea2ff;--go:#57c78a;--go-bg:#16301f;--warn:#f0b35a;--warn-bg:#33270f;--bad:#ff8a80;--bad-bg:#3a1a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header .sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.go{background:var(--go-bg);color:var(--go)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card .t{font-weight:600;margin:6px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 0}
.meta b{color:var(--ink);font-weight:600}
.dates{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.date{border-radius:8px;padding:6px 10px;font-size:13px;background:var(--bg);border:1px solid var(--line)}
.date b{font-size:15px}
.date.hot{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
details{margin-top:6px;font-size:14px}
summary{cursor:pointer;color:var(--accent)}
.why{white-space:pre-wrap;margin:8px 0;color:var(--ink)}
ul{margin:4px 0 4px 18px;padding:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:8px 12px;font-size:14px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.btn.primary{background:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:700}.kpi .l{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{text-align:right;white-space:nowrap}
a{color:var(--accent)}
.empty{color:var(--muted);padding:20px;text-align:center}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#login .card{padding:22px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.hint{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="login"><div class="card">
  <h1 style="font-size:18px;margin:0 0 6px">Тендеры ВХР</h1>
  <p class="hint" style="margin:0 0 14px">Введите пароль, чтобы открыть дашборд.</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" autofocus>
  <button class="btn primary" style="margin-top:10px;width:100%">Открыть</button></form>
  <div id="err"></div>
</div></div>
<div id="app" hidden>
<header>
  <h1>Тендеры ООО «Волгахимресурс»</h1>
  <div class="sub" id="sub"></div>
  <nav><button data-t="live" class="on">Актуальные</button><button data-t="stats">Итоги и статистика</button><button data-t="send">На анализ</button></nav>
</header>
<main>
  <section id="t-live"></section>
  <section id="t-stats" hidden></section>
  <section id="t-send" hidden></section>
</main>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.salt),iterations:BLOB.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.iv)},key,b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=v=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(v)+' ₽';
const ddmm=iso=>iso&&/^\d{4}-\d\d-\d\d/.test(iso)?iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):(iso||'—');
const daysTo=(iso,today)=>Math.round((new Date(iso)-new Date(today))/864e5);
function card(x,D){
  const left=daysTo(x.deadline,D.today), hot=left<=3;
  const v=x.verdict==='УЧАСТВОВАТЬ'?'<span class="pill go">Участвовать</span>':'<span class="pill warn">С оговорками</span>';
  const conds=x.conds.length?`<p><b>Условия:</b></p><ul>${x.conds.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'';
  const risks=x.risks.length?`<p><b>Риски:</b></p><ul>${x.risks.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'';
  return `<div class="card">${v} <span class="hint">№ ${esc(x.id)} · ${esc(x.law)} · ${esc(x.type||'')}</span>
  <div class="t">${esc(x.title)}</div>
  <div class="dates"><div class="date ${hot?'hot':''}">Подача заявок до<br><b>${esc(x.deadline_dt||ddmm(x.deadline))}</b> ${left>=0?`(осталось ${left} дн.)`:''}</div>
  <div class="date">Аукцион / подведение итогов<br><b>${esc(x.auction||'см. на площадке')}</b></div></div>
  <div class="meta"><div>НМЦК<br><b>${rub(x.price)}</b></div><div>Регион<br><b>${esc(x.region||'—')}</b></div>
  <div>Заказчик<br><b>${esc(x.customer||'—')}</b></div><div>Площадка<br><b>${esc(x.platform||'—')}</b></div>
  <div>Обеспечение заявки<br><b>${rub(x.sec_app)}</b></div><div>Обеспечение контракта<br><b>${rub(x.sec_contract)}</b></div></div>
  <details><summary>Почему такой вердикт (разбор от ${ddmm(x.analyzed)})</summary><div class="why">${esc(x.why)}</div>${conds}${risks}</details>
  <div class="btns"><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть закупку на zakupki.gov.ru</a>
  <button class="btn primary" onclick="sendReq('${esc(x.id)}',this)">Отправить документацию на анализ Клоду</button></div></div>`;
}
function renderLive(D){
  const live=D.items.filter(x=>x.deadline>=D.today).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const go=live.filter(x=>x.verdict==='УЧАСТВОВАТЬ'), warn=live.filter(x=>x.verdict!=='УЧАСТВОВАТЬ');
  const sec=(t,cls,arr)=>`<h2><span class="pill ${cls}">${arr.length}</span>${t}</h2>`+(arr.length?arr.map(x=>card(x,D)).join(''):'<div class="card empty">Сейчас таких закупок нет</div>');
  document.getElementById('t-live').innerHTML=sec('Участвовать','go',go)+sec('Участвовать с оговорками','warn',warn);
}
let sortKey='deadline',sortDir=-1;
function renderStats(D){
  const past=D.items.filter(x=>x.deadline<D.today);
  const done=past.filter(x=>x.status==='итоги'&&x.reduction!=null);
  const red=done.map(x=>x.reduction).sort((a,b)=>a-b);
  const med=red.length?red[Math.floor(red.length/2)]:null;
  const avg=red.length?red.reduce((s,v)=>s+v,0)/red.length:null;
  const bids=done.filter(x=>x.bids!=null).map(x=>x.bids);
  const one=bids.filter(b=>b===1).length;
  const kp=(v,l)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const rows=[...past].sort((a,b)=>{const va=a[sortKey]??'',vb=b[sortKey]??'';return (va>vb?1:va<vb?-1:0)*sortDir});
  const th=(k,t)=>`<th data-k="${k}">${t}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`;
  document.getElementById('t-stats').innerHTML=`<h2>Что было с закупками, которые мы рекомендовали</h2>
  <div class="kpis">${kp(past.length,'прошедших закупок')}${kp(done.length,'с известными итогами')}
  ${kp(avg==null?'—':avg.toFixed(1)+' %','среднее снижение от НМЦК')}${kp(med==null?'—':med.toFixed(1)+' %','медианное снижение')}
  ${kp(bids.length?(bids.reduce((s,v)=>s+v,0)/bids.length).toFixed(1):'—','заявок в среднем')}${kp(bids.length?Math.round(one/bids.length*100)+' %':'—','закупок с одной заявкой')}</div>
  <h2>Все прошедшие закупки</h2><div class="tbl"><table><thead><tr>${th('deadline','Подача до')}${th('title','Объект')}${th('region','Регион')}${th('price','НМЦК')}${th('bids','Заявок')}${th('winner','Победитель')}${th('win_price','Цена победителя')}${th('reduction','Снижение')}${th('verdict','Вердикт')}</tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${ddmm(x.deadline)}</td><td><a href="${esc(x.protocol||x.url)}" target="_blank" rel="noopener">${esc((x.title||'').slice(0,110))}</a><div class="hint">№ ${esc(x.id)} · ${esc(x.law)}</div></td><td>${esc(x.region||'')}</td>
  <td class="n">${rub(x.price)}</td><td class="n">${x.bids??'—'}</td><td>${esc(x.winner||(x.status==='итоги'?'не раскрыт (223-ФЗ)':(x.status||'нет данных')))}</td>
  <td class="n">${rub(x.win_price)}</td><td class="n">${x.reduction==null?'—':x.reduction.toFixed(1)+' %'}</td><td>${x.verdict==='УЧАСТВОВАТЬ'?'Участвовать':'С оговорками'}</td></tr>`).join('')}
  </tbody></table></div><p class="hint">По 223-ФЗ площадки скрывают названия участников, поэтому победитель там часто не раскрыт; цена — по реестру договоров.</p>`;
  document.querySelectorAll('#t-stats th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;sortDir=sortKey===k?-sortDir:1;sortKey=k;renderStats(D)});
}
let DATA=null;
async function sendReq(id,btn,note){
  const old=btn.textContent;btn.disabled=true;btn.textContent='Отправляю…';
  try{
    const r=await fetch(`https://api.github.com/repos/${DATA.req_repo}/issues`,{method:'POST',
      headers:{'Authorization':'Bearer '+DATA.req_token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({title:'an '+id,body:'Заявка с дашборда: '+new Date().toLocaleString('ru-RU')+(note?'\n'+note:'')})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    btn.textContent='✅ Заявка принята';
    alert('Закупка № '+id+' поставлена в очередь на анализ. Разбор появится на дашборде в течение рабочего дня (очередь разбирается в 10:30 и 16:30 по Москве+1).');
  }catch(e){btn.disabled=false;btn.textContent=old;
    alert('Не получилось отправить ('+e.message+'). Отправьте номер Юрию Ножкину или через Telegram-бота @'+DATA.bot);}
}
function renderSend(D){
  document.getElementById('t-send').innerHTML=`<h2>Отправить закупку на анализ Клоду</h2><div class="card">
  <p>Вставьте номер закупки или ссылку на неё с zakupki.gov.ru и нажмите «Отправить на анализ». Закупка встанет в очередь, разбор появится здесь, на дашборде (обычно в течение рабочего дня).</p>
  <input id="reg" placeholder="Например: 0372200080926000015 или ссылка"><div id="regerr" class="hint" style="margin-top:6px"></div>
  <div class="btns"><button id="go" class="btn primary">Отправить на анализ</button></div>
  <p class="hint">Запасной путь — Telegram-бот @${D.bot}: команда /analyze и номер (доступ открывает Юрий Ножкин).</p></div>`;
  const inp=document.getElementById('reg'),b=document.getElementById('go'),err=document.getElementById('regerr');
  inp.oninput=()=>{const m=inp.value.match(/(\d{11,19})/);err.textContent=m?'Номер: '+m[1]:(inp.value?'Не вижу номера закупки (11–19 цифр)':'')};
  b.onclick=()=>{const m=inp.value.match(/(\d{11,19})/);if(!m){err.textContent='Сначала вставьте номер или ссылку';return}sendReq(m[1],b,'Ввод вручную: '+inp.value.slice(0,300))};
}
function show(D){
  DATA=D;
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
  document.getElementById('sub').textContent='Обновлено '+D.generated+' · закупок с положительным вердиктом: '+D.items.length;
  renderLive(D);renderStats(D);renderSend(D);
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['live','stats','send'].forEach(t=>document.getElementById('t-'+t).hidden=t!==b.dataset.t)});
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
  try{const D=await decrypt(pw);try{sessionStorage.setItem('vhr_pw',pw)}catch(_){ }show(D)}catch(_){document.getElementById('err').textContent='Неверный пароль'}};
(async()=>{try{const pw=sessionStorage.getItem('vhr_pw');if(pw)show(await decrypt(pw))}catch(_){}})();
</script>
